spring.application.name=dcc075
spring.config.import=optional:file:.env[.properties]

# --- Banco H2 em memÃ³ria (recriado a cada execucao) ---
spring.datasource.url=jdbc:h2:mem:estoque

# Hibernate cria as tabelas a partir das entidades ao subir e apaga ao desligar
spring.jpa.hibernate.ddl-auto=create-drop

# Mostra o SQL gerado no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desliga o "Open Session in View": a sessao do banco nao fica aberta
# durante a renderizacao da pÃ¡gina. Obriga a carregar tudo que a view
# precisa no service, evitando queries escondidas (N+1) no template.
spring.jpa.open-in-view=false

# --- Atividade 02: OAuth2 com Google ---
spring.security.oauth2.client.registration.google.client-id=445976295057-h3ndbbenqio71mk7f80gnaogqbs1tf39.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# E-mail Google cadastrado como GERENTE no RBAC (vem do .env; vazio = ninguém).
dcc075.oauth.test-email=${OAUTH_TEST_EMAIL:}
