spring.application.name=dcc075

# --- Banco H2 em memória (recriado a cada execução) ---
spring.datasource.url=jdbc:h2:mem:estoque

# Hibernate cria as tabelas a partir das entidades ao subir e apaga ao desligar
spring.jpa.hibernate.ddl-auto=create-drop

# Mostra o SQL gerado no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desliga o "Open Session in View": a sessão do banco não fica aberta
# durante a renderização da página. Obriga a carregar tudo que a view
# precisa no service, evitando queries escondidas (N+1) no template.
spring.jpa.open-in-view=false